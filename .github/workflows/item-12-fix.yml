name: Item 12 fix
on:
  push:
    paths:
      - .github/workflows/item-12-fix.yml
permissions:
  contents: write
jobs:
  item-12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply split with complete imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt'); t=p.read_text()
          a=t.index('@Composable\nprivate fun ChatBubble'); b=t.index('@Composable\nprivate fun ChatInputBar'); c=t.index('// ── Pending Image Preview'); d=t.index('// ── Tool Picker Bottom Sheet'); e=t.index('// ── Conversation History Bottom Sheet')
          common='''package com.gemofgemma.ui.chat\n\nimport android.graphics.BitmapFactory\nimport androidx.activity.compose.*\nimport androidx.activity.result.*\nimport androidx.activity.result.contract.*\nimport androidx.compose.animation.*\nimport androidx.compose.animation.core.*\nimport androidx.compose.foundation.*\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.lazy.*\nimport androidx.compose.foundation.shape.*\nimport androidx.compose.foundation.text.selection.*\nimport androidx.compose.material.icons.*\nimport androidx.compose.material.icons.automirrored.filled.*\nimport androidx.compose.material.icons.filled.*\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.*\nimport androidx.compose.ui.draw.*\nimport androidx.compose.ui.graphics.*\nimport androidx.compose.ui.hapticfeedback.*\nimport androidx.compose.ui.layout.*\nimport androidx.compose.ui.platform.*\nimport androidx.compose.ui.text.*\nimport androidx.compose.ui.text.font.*\nimport androidx.compose.ui.text.style.*\nimport androidx.compose.ui.unit.*\nimport com.gemofgemma.core.model.*\nimport com.gemofgemma.ui.camera.*\nimport com.gemofgemma.ui.components.*\nimport com.gemofgemma.ui.theme.*\nimport com.google.accompanist.permissions.*\n\n'''
          Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatBubble.kt').write_text(common+t[a:b].replace('@Composable\nprivate fun ChatBubble','@Composable\nfun ChatBubble',1))
          Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatInputBar.kt').write_text(common+t[b:c].replace('@Composable\nprivate fun ChatInputBar','@Composable\nfun ChatInputBar',1))
          Path('ui/src/main/java/com/gemofgemma/ui/chat/ToolPickerSheet.kt').write_text(common+t[d:e].replace('private fun ToolPickerBottomSheet','fun ToolPickerBottomSheet',1))
          marker='// ── Minimal header ───────────────────────────────────'; banner='// ── Model offline banner ─────────────────────────────────'
          hs=t.index(marker); he=t.index(banner,hs)
          t=t[:hs]+'// ── Minimal header ───────────────────────────────────\n        ChatTopBar(onHistoryClick = viewModel::toggleConversationHistory, onNewChat = viewModel::newChat, onSettingsClick = onNavigateToSettings)\n        '+t[he:]
          for sm,em in [('@Composable\nprivate fun ChatBubble','@Composable\nprivate fun ChatInputBar'),('@Composable\nprivate fun ChatInputBar','// ── Pending Image Preview'),('// ── Tool Picker Bottom Sheet','// ── Conversation History Bottom Sheet')]:
              s=t.find(sm)
              if s>=0:
                  ee=t.find(em,s)
                  if ee>=0:t=t[:s]+t[ee:]
          p.write_text(t)
          Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatTopBar.kt').write_text('''package com.gemofgemma.ui.chat\n\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.filled.*\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.Composable\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.unit.dp\n\n@Composable\nfun ChatTopBar(onHistoryClick: () -> Unit, onNewChat: () -> Unit, onSettingsClick: () -> Unit) {\n    Surface(color=MaterialTheme.colorScheme.surface.copy(alpha=.95f), tonalElevation=2.dp) {\n        Row(Modifier.fillMaxWidth().statusBarsPadding().padding(horizontal=8.dp,vertical=10.dp), verticalAlignment=Alignment.CenterVertically) {\n            Icon(Icons.Default.SmartToy, contentDescription="OmniCode", tint=MaterialTheme.colorScheme.primary, modifier=Modifier.size(28.dp))\n            Spacer(Modifier.width(8.dp)); Text("OmniCode", style=MaterialTheme.typography.titleMedium, fontWeight=FontWeight.SemiBold)\n            Spacer(Modifier.weight(1f))\n            IconButton(onClick=onHistoryClick, modifier=Modifier.size(48.dp)){Icon(Icons.Default.Forum, contentDescription="Chat History")}\n            IconButton(onClick=onNewChat, modifier=Modifier.size(48.dp)){Icon(Icons.Default.Add, contentDescription="New Chat")}\n            IconButton(onClick=onSettingsClick, modifier=Modifier.size(48.dp)){Icon(Icons.Default.Settings, contentDescription="Settings")}\n        }\n    }\n}\n''')
          PY
      - name: Compile item 12
        run: ./gradlew --no-configuration-cache :ui:compileDebugKotlin --stacktrace
      - name: Commit item 12 and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src/main/java/com/gemofgemma/ui/chat
          git rm item12-compile.log .github/workflows/item-12-split.yml .github/workflows/item-12-debug.yml .github/workflows/item-12-fix.yml || true
          git commit -m "refactor: split ChatScreen composables"
          git push origin HEAD
