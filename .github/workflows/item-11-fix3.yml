name: Item 11 fix 3
on:
  push:
    paths:
      - .github/workflows/item-11-fix3.yml
permissions:
  contents: write
jobs:
  item-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename research document
        run: |
          set -euxo pipefail
          old='Gemma4Research/08-silent-autonomous-execution.md'
          new='Gemma4Research/08-android-automation-api-research.md'
          cp "$old" "$new"
          sed -i '1s/^# Silent & Autonomous Execution on Android with Gemma 4/# Android Automation API Research — Gemma 4/' "$new"
          printf '%s\n\n' '> **Note:** this is background research; nothing in this document is implemented as an app feature.' | cat - "$new" > "$new.tmp"
          mv "$new.tmp" "$new"
          rm "$old"
          find . -type f -name '*.md' -not -path './.git/*' -print0 | xargs -0 sed -i 's#08-silent-autonomous-execution\.md#08-android-automation-api-research.md#g'
          test -f "$new"
          test ! -f "$old"
      - name: Commit item 11
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemma4Research
          git commit -m "docs: rename Android automation research"
          git push origin HEAD
      - name: Remove temporary workflows
        run: |
          git rm .github/workflows/item-11-fix.yml .github/workflows/item-11-fix2.yml .github/workflows/item-11-fix3.yml .github/workflows/items-11-14-sequential.yml || true
          git commit -m "chore: remove temporary item verification workflows" || true
          git push origin HEAD
