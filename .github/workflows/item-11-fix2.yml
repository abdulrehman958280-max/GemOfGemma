name: Item 11 fix 2
on:
  push:
    paths:
      - .github/workflows/item-11-fix2.yml
permissions:
  contents: write
jobs:
  item-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename research and update all markdown references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = Path('Gemma4Research/08-silent-autonomous-execution.md')
          new = Path('Gemma4Research/08-android-automation-api-research.md')
          if old.exists():
              text = old.read_text()
              text = text.replace('# Silent & Autonomous Execution on Android with Gemma 4', '# Android Automation API Research — Gemma 4', 1)
              note = '> **Note:** this is background research; nothing in this document is implemented as an app feature.\n\n'
              if not text.startswith('> **Note:** this is background research; nothing in this document is implemented as an app feature.'):
                  text = note + text
              new.write_text(text)
              old.unlink()
          for path in Path('.').rglob('*.md'):
              if '.git' in path.parts:
                  continue
              path.write_text(path.read_text().replace('08-silent-autonomous-execution.md', '08-android-automation-api-research.md'))
          PY
          test -f Gemma4Research/08-android-automation-api-research.md
          test ! -f Gemma4Research/08-silent-autonomous-execution.md
          ! grep -R "08-silent-autonomous-execution.md" --exclude-dir=.git .
      - name: Commit item 11
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemma4Research
          git commit -m "docs: rename Android automation research"
          git push origin HEAD
      - name: Remove temporary workflows
        run: |
          git rm .github/workflows/item-11-fix.yml .github/workflows/item-11-fix2.yml .github/workflows/items-11-14-sequential.yml || true
          git commit -m "chore: remove temporary item verification workflows" || true
          git push origin HEAD
