name: Item 11 fix
on:
  push:
    paths:
      - .github/workflows/item-11-fix.yml
permissions:
  contents: write
jobs:
  item-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename and update references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = Path('Gemma4Research/08-silent-autonomous-execution.md')
          new = Path('Gemma4Research/08-android-automation-api-research.md')
          text = old.read_text()
          text = text.replace('# Silent & Autonomous Execution on Android with Gemma 4', '# Android Automation API Research — Gemma 4', 1)
          note = '> **Note:** this is background research; nothing in this document is implemented as an app feature.\n\n'
          if not text.startswith('> **Note:** this is background research; nothing in this document is implemented as an app feature.'):
              text = note + text
          new.write_text(text)
          old.unlink()
          for root in [Path('Gemma4Research')]:
              for path in root.rglob('*.md'):
                  path.write_text(path.read_text().replace('08-silent-autonomous-execution.md', '08-android-automation-api-research.md'))
          PY
          test -f Gemma4Research/08-android-automation-api-research.md
          test ! -f Gemma4Research/08-silent-autonomous-execution.md
          if grep -R "08-silent-autonomous-execution.md" --exclude-dir=.git .; then exit 1; fi
      - name: Commit item 11
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemma4Research
          git commit -m "docs: rename Android automation research"
          git push origin HEAD
      - name: Remove fix workflow
        run: |
          git rm .github/workflows/item-11-fix.yml
          git commit -m "chore: remove item 11 fix workflow"
          git push origin HEAD
