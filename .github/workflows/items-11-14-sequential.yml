name: Items 11-14 sequential verification
on:
  push:
    paths:
      - .github/workflows/items-11-14-sequential.yml
permissions:
  contents: write

jobs:
  item-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename research document
        run: |
          set -euo pipefail
          old='Gemma4Research/08-silent-autonomous-execution.md'
          new='Gemma4Research/08-android-automation-api-research.md'
          test -f "$old"
          python3 - <<'PY'
          from pathlib import Path
          old = Path('Gemma4Research/08-silent-autonomous-execution.md')
          new = Path('Gemma4Research/08-android-automation-api-research.md')
          text = old.read_text()
          text = text.replace('# Silent & Autonomous Execution on Android with Gemma 4', '# Android Automation API Research — Gemma 4', 1)
          note = '> **Note:** this is background research; nothing in this document is implemented as an app feature.\n\n'
          if not text.startswith('> **Note:** this is background research; nothing in this document is implemented as an app feature.'):
              text = note + text
          new.write_text(text)
          old.unlink()
          PY
          if grep -R "08-silent-autonomous-execution.md" --exclude-dir=.git --exclude='items-11-14-sequential.yml' .; then exit 1; fi
      - name: Commit item 11
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemma4Research
          git commit -m "docs: rename Android automation research"
          git push origin HEAD

  item-12:
    needs: item-11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Split ChatScreen composables
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt')
          text = p.read_text()

          def extract_between(start_marker, end_marker):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return start, end, text[start:end]

          chat_start = text.index('@Composable\nprivate fun ChatBubble')
          input_start = text.index('@Composable\nprivate fun ChatInputBar')
          pending_start = text.index('// ── Pending Image Preview')
          tool_start = text.index('// ── Tool Picker Bottom Sheet')
          conversation_start = text.index('// ── Conversation History Bottom Sheet')

          chat_block = text[chat_start:input_start]
          input_block = text[input_start:pending_start]
          tool_block = text[tool_start:conversation_start]

          # Preserve the public call signatures used by ChatScreen while keeping helpers private.
          chat_block = chat_block.replace('@Composable\nprivate fun ChatBubble', '@Composable\nfun ChatBubble', 1)
          input_block = input_block.replace('@Composable\nprivate fun ChatInputBar', '@Composable\nfun ChatInputBar', 1)
          tool_block = tool_block.replace('private fun ToolPickerBottomSheet', 'fun ToolPickerBottomSheet', 1)

          common = '''package com.gemofgemma.ui.chat\n\nimport android.graphics.BitmapFactory\nimport androidx.compose.animation.*\nimport androidx.compose.foundation.*\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.lazy.*\nimport androidx.compose.foundation.shape.*\nimport androidx.compose.foundation.text.selection.SelectionContainer\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.automirrored.filled.Send\nimport androidx.compose.material.icons.filled.*\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.draw.clip\nimport androidx.compose.ui.graphics.*\nimport androidx.compose.ui.hapticfeedback.HapticFeedbackType\nimport androidx.compose.ui.layout.ContentScale\nimport androidx.compose.ui.platform.*\nimport androidx.compose.ui.text.*\nimport androidx.compose.ui.text.style.TextOverflow\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\nimport com.gemofgemma.core.model.*\nimport com.gemofgemma.ui.camera.*\nimport com.gemofgemma.ui.components.*\nimport com.gemofgemma.ui.theme.*\nimport com.google.accompanist.permissions.*\n\n'''

          Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatBubble.kt').write_text(common + chat_block)
          Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatInputBar.kt').write_text(common + input_block)
          Path('ui/src/main/java/com/gemofgemma/ui/chat/ToolPickerSheet.kt').write_text(common + tool_block)

          # Replace the inline header with a dedicated composable.
          marker = '// ── Minimal header ───────────────────────────────────'
          banner = '// ── Model offline banner ─────────────────────────────────'
          hstart = text.index(marker)
          hend = text.index(banner, hstart)
          header = '''// ── Minimal header ───────────────────────────────────\n        ChatTopBar(\n            onHistoryClick = viewModel::toggleConversationHistory,\n            onNewChat = viewModel::newChat,\n            onSettingsClick = onNavigateToSettings\n        )\n        '''
          text = text[:hstart] + header + text[hend:]

          # Remove moved blocks. Do this from the end so offsets stay valid.
          ranges = [(chat_start, input_start), (input_start, pending_start), (tool_start, conversation_start)]
          # Header changed the string, so locate blocks again.
          for start_marker, end_marker in [
              ('@Composable\nprivate fun ChatBubble', '@Composable\nprivate fun ChatInputBar'),
              ('@Composable\nprivate fun ChatInputBar', '// ── Pending Image Preview'),
              ('// ── Tool Picker Bottom Sheet', '// ── Conversation History Bottom Sheet')
          ]:
              s = text.find(start_marker)
              if s >= 0:
                  e = text.find(end_marker, s)
                  if e >= 0:
                      text = text[:s] + text[e:]

          p.write_text(text)

          top = '''package com.gemofgemma.ui.chat\n\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.filled.*\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.Composable\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.unit.dp\nimport com.gemofgemma.ui.theme.*\n\n@Composable\nfun ChatTopBar(\n    onHistoryClick: () -> Unit,\n    onNewChat: () -> Unit,\n    onSettingsClick: () -> Unit\n) {\n    Surface(\n        color = MaterialTheme.colorScheme.surface.copy(alpha = 0.95f),\n        tonalElevation = 2.dp,\n    ) {\n        Row(\n            modifier = Modifier\n                .fillMaxWidth()\n                .statusBarsPadding()\n                .padding(horizontal = 8.dp, vertical = 10.dp),\n            verticalAlignment = Alignment.CenterVertically\n        ) {\n            Icon(\n                Icons.Default.SmartToy,\n                contentDescription = "OmniCode",\n                tint = MaterialTheme.colorScheme.primary,\n                modifier = Modifier.size(28.dp)\n            )\n            Spacer(modifier = Modifier.width(8.dp))\n            Text(\n                text = "OmniCode",\n                style = MaterialTheme.typography.titleMedium,\n                fontWeight = androidx.compose.ui.text.font.FontWeight.SemiBold,\n                color = MaterialTheme.colorScheme.onSurface\n            )\n            Spacer(modifier = Modifier.weight(1f))\n            IconButton(onClick = onHistoryClick, modifier = Modifier.size(48.dp)) {\n                Icon(Icons.Default.Forum, contentDescription = "Chat History", tint = MaterialTheme.colorScheme.onSurfaceVariant)\n            }\n            IconButton(onClick = onNewChat, modifier = Modifier.size(48.dp)) {\n                Icon(Icons.Default.Add, contentDescription = "New Chat", tint = MaterialTheme.colorScheme.primary)\n            }\n            IconButton(onClick = onSettingsClick, modifier = Modifier.size(48.dp)) {\n                Icon(Icons.Default.Settings, contentDescription = "Settings", tint = MaterialTheme.colorScheme.onSurfaceVariant)\n            }\n        }\n    }\n}\n'''
          Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatTopBar.kt').write_text(top)
          PY
      - name: Compile item 12
        run: ./gradlew --no-configuration-cache :ui:compileDebugKotlin --stacktrace
      - name: Commit item 12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src/main/java/com/gemofgemma/ui/chat
          git commit -m "refactor: split ChatScreen composables"
          git push origin HEAD

  item-13:
    needs: item-12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Externalize screen strings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, html
          files = [
              Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt'),
              Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatBubble.kt'),
              Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatInputBar.kt'),
              Path('ui/src/main/java/com/gemofgemma/ui/chat/ToolPickerSheet.kt'),
              Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatTopBar.kt'),
              Path('ui/src/main/java/com/gemofgemma/ui/onboarding/OnboardingScreen.kt'),
              Path('ui/src/main/java/com/gemofgemma/ui/settings/SettingsScreen.kt'),
          ]
          strings = {}
          def key_for(value):
              key = re.sub(r'[^A-Za-z0-9]+', '_', value).strip('_').lower()
              if not key or key[0].isdigit(): key = 'ui_' + key
              return key[:70]
          for path in files:
              if not path.exists(): continue
              text = path.read_text()
              if 'stringResource(' in text:
                  pass
              candidates = re.findall(r'(?<![A-Za-z0-9_])(?:text|contentDescription)\s*=\s*"((?:\\.|[^"\\])*)"', text)
              candidates += re.findall(r'(?<![A-Za-z0-9_])Text\(\s*"((?:\\.|[^"\\])*)"', text)
              for raw in candidates:
                  if '$' in raw or len(raw.strip()) < 2: continue
                  try: value = json.loads('"' + raw + '"')
                  except Exception: continue
                  if value.startswith(('http://','https://')): continue
                  key = key_for(value)
                  base = key; i = 2
                  while key in strings and strings[key] != value:
                      key = f'{base}_{i}'; i += 1
                  strings[key] = value
              
          xml = Path('ui/src/main/res/values/strings.xml')
          existing = xml.read_text() if xml.exists() else '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'
          for key, value in strings.items():
              if re.search(rf'<string name="{re.escape(key)}">', existing): continue
              escaped = html.escape(value, quote=False).replace("'", "\\'")
              existing = existing.replace('</resources>', f'    <string name="{key}">{escaped}</string>\n</resources>')
          xml.write_text(existing)

          for path in files:
              if not path.exists(): continue
              text = path.read_text()
              original = text
              def repl_named(m):
                  prefix, raw = m.group(1), m.group(2)
                  if '$' in raw: return m.group(0)
                  try: value = json.loads('"' + raw + '"')
                  except Exception: return m.group(0)
                  key = key_for(value)
                  if key not in strings:
                      for k,v in strings.items():
                          if v == value: key=k; break
                  return f'{prefix}stringResource(R.string.{key})'
              text = re.sub(r'(\b(?:text|contentDescription)\s*=\s*)"((?:\\.|[^"\\])*)"', repl_named, text)
              def repl_text(m):
                  raw = m.group(1)
                  if '$' in raw: return m.group(0)
                  try: value = json.loads('"' + raw + '"')
                  except Exception: return m.group(0)
                  key = key_for(value)
                  if key not in strings:
                      for k,v in strings.items():
                          if v == value: key=k; break
                  return f'Text(stringResource(R.string.{key})'
              text = re.sub(r'Text\(\s*"((?:\\.|[^"\\])*)"', repl_text, text)
              if text != original and 'stringResource(' in text and 'import androidx.compose.ui.res.stringResource' not in text:
                  text = text.replace('package ' + '.'.join(path.parts[4:-1]) + '\n', 'package ' + '.'.join(path.parts[4:-1]) + '\n\nimport androidx.compose.ui.res.stringResource', 1) if False else text
                  lines = text.splitlines()
                  idx = 1
                  lines.insert(idx, 'import androidx.compose.ui.res.stringResource')
                  text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
              path.write_text(text)
          PY
      - name: Compile item 13
        run: ./gradlew --no-configuration-cache :ui:compileDebugKotlin --stacktrace
      - name: Commit item 13
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src/main/java/com/gemofgemma/ui ui/src/main/res/values/strings.xml
          git commit -m "refactor: externalize UI strings"
          git push origin HEAD

  item-14:
    needs: item-13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fix actionable content descriptions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt')
          text = p.read_text()
          replacements = {
              'Icons.Default.CameraAlt,\n                                contentDescription = null': 'Icons.Default.CameraAlt,\n                                contentDescription = stringResource(R.string.camera)',
              'Icons.Default.PhotoLibrary,\n                                contentDescription = null': 'Icons.Default.PhotoLibrary,\n                                contentDescription = stringResource(R.string.gallery)',
              'Icons.Default.Build,\n                                contentDescription = null': 'Icons.Default.Build,\n                                contentDescription = stringResource(R.string.tools)',
          }
          for old,new in replacements.items(): text = text.replace(old,new)
          if 'stringResource(R.string.' in text and 'import androidx.compose.ui.res.stringResource' not in text:
              lines=text.splitlines(); lines.insert(1,'import androidx.compose.ui.res.stringResource'); text='\n'.join(lines)+'\n'
          p.write_text(text)
          PY
      - name: Verify remaining null descriptions are decorative
        run: |
          grep -n -B3 -A1 'contentDescription = null' ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt || true
      - name: Compile item 14
        run: ./gradlew --no-configuration-cache :ui:compileDebugKotlin --stacktrace
      - name: Commit item 14
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt
          git commit -m "fix: add actionable chat content descriptions"
          git push origin HEAD

  cleanup:
    needs: [item-11, item-12, item-13, item-14]
    if: always() && needs.item-14.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove sequential workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/items-11-14-sequential.yml
          git commit -m "chore: remove sequential polish workflow"
          git push origin HEAD
