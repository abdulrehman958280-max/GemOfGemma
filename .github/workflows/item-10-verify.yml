name: Item 10 verification
on:
  push:
    paths:
      - app/src/main/AndroidManifest.xml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: grep -n 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
      - run: ./gradlew --no-configuration-cache :app:compileDebugKotlin --stacktrace
      - name: Remove verification workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/item-10-verify.yml
          git commit -m "chore: remove item 10 verification workflow"
          git push origin HEAD
