name: Item 12 current verification
on:
  push:
    paths:
      - .github/workflows/item-12-current-verify.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-configuration-cache :ui:compileDebugKotlin --stacktrace
      - name: Clean temporary verification files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/item-12-current-verify.yml .github/workflows/item-12-split.yml .github/workflows/item-12-debug.yml .github/workflows/item-12-fix.yml .github/workflows/item-12-errors.yml .github/workflows/item-12-final.yml .github/workflows/item-12-fix3.yml item12-compile.log || true
          git commit -m "chore: clean item 12 verification files" || true
          git push origin HEAD
