name: Final polish verification
on:
  push:
    paths:
      - .github/workflows/finalize3.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Finalize research note and references
        shell: python
        run: |
          from pathlib import Path
          import re
          doc=Path('Gemma4Research/08-android-automation-api-research.md')
          if not doc.exists(): raise SystemExit('Renamed research document is missing')
          text=doc.read_text()
          note='Note: this is background research; nothing in this document is implemented as an app feature.'
          if note not in text:
              lines=text.splitlines(True)
              insert=1 if lines and lines[0].lstrip().startswith('#') else 0
              lines.insert(insert,note+'\n\n')
              doc.write_text(''.join(lines))
          for p in Path('Gemma4Research').rglob('*.md'):
              t=p.read_text()
              if '08-silent-autonomous-execution.md' in t:
                  p.write_text(t.replace('08-silent-autonomous-execution.md','08-android-automation-api-research.md'))
      - name: Final debug build
        run: ./gradlew --no-configuration-cache assembleDebug --stacktrace
      - name: Final static verification
        shell: bash
        run: |
          git diff --check
          echo 'Workflow files:'
          find .github/workflows -maxdepth 1 -type f -print
          echo 'Remaining chat null content descriptions:'
          git grep -n 'contentDescription = null' -- ui/src/main/java/com/gemofgemma/ui/chat || true
          echo 'Legacy branding:'
          git grep -n -E 'GemOfGemma|Gem of Gemma' -- app ui || true
          test -f ui/src/main/res/values/strings.xml
      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find .github/workflows -maxdepth 1 -type f ! -name 'build-apk.yml' -delete
          git add -A
          git commit -m "chore: finalize 14 item polish" || true
          git push origin HEAD:fix/sequential-14-item-polish
