name: Final polish verification
on:
  push:
    paths:
      - .github/workflows/cleanup-and-final-build.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Remove temporary polish workflows
        shell: bash
        run: |
          find .github/workflows -type f ! -name 'build-apk.yml' -delete
          test -f .github/workflows/build-apk.yml
      - name: Validate research references
        shell: bash
        run: |
          ! git grep -n '08-silent-autonomous-execution.md' -- ':!*.lock' || (echo 'stale research reference found' && exit 1)
          grep -q 'Note: this is background research; nothing in this document is implemented as an app feature.' Gemma4Research/08-android-automation-api-research.md
      - name: Final debug build
        run: ./gradlew --no-configuration-cache assembleDebug --stacktrace
      - name: Verify final tree and diff
        shell: bash
        run: |
          git diff --check
          echo 'Remaining workflows:'
          find .github/workflows -maxdepth 1 -type f -print
          echo 'Remaining contentDescription nulls in chat:'
          git grep -n 'contentDescription = null' -- ui/src/main/java/com/gemofgemma/ui/chat || true
          echo 'Legacy brand references in app/ui sources:'
          git grep -n -E 'GemOfGemma|Gem of Gemma' -- app ui || true
      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "chore: remove temporary polish workflows" || true
          git push origin HEAD:fix/sequential-14-item-polish
