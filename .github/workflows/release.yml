name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f app/release.keystore ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew assembleRelease
          fi

      - name: Rename APKs
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p app/build/outputs/apk/release-assets

          if ls app/build/outputs/apk/release/*.apk 1>/dev/null 2>&1; then
            BUILD_TYPE="release"
          else
            BUILD_TYPE="debug"
          fi

          for apk in app/build/outputs/apk/${BUILD_TYPE}/*.apk; do
            BASENAME=$(basename "$apk" .apk)
            # Extract ABI from filename (e.g. app-arm64-v8a-debug -> arm64-v8a)
            case "$BASENAME" in
              *arm64-v8a*) SUFFIX="-arm64-v8a" ;;
              *armeabi-v7a*) SUFFIX="-armeabi-v7a" ;;
              *x86_64*) SUFFIX="-x86_64" ;;
              *universal*) SUFFIX="-universal" ;;
              *) SUFFIX="" ;;
            esac
            if [ "$BUILD_TYPE" = "debug" ]; then
              cp "$apk" "app/build/outputs/apk/release-assets/GemOfGemma-${VERSION}${SUFFIX}-debug.apk"
            else
              cp "$apk" "app/build/outputs/apk/release-assets/GemOfGemma-${VERSION}${SUFFIX}.apk"
            fi
          done

          ls -lh app/build/outputs/apk/release-assets/

      - name: Extract release notes
        id: notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Use tag annotation if available, otherwise generate default notes
          TAG_MSG=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" 2>/dev/null || true)
          if [ -n "$TAG_MSG" ]; then
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "$TAG_MSG" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "## GemOfGemma $VERSION" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "Download the APK below and install it on your Android device (API 31+)." >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GemOfGemma ${{ steps.notes.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: app/build/outputs/apk/release-assets/GemOfGemma-*
