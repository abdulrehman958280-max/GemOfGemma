name: Item 12 fix 2
on:
  push:
    paths:
      - .github/workflows/item-12-fix2.yml
permissions:
  contents: write
jobs:
  item-12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Expose moved ChatBubble helpers
        run: |
          sed -i 's/private fun ThinkingSection/fun ThinkingSection/' ui/src/main/java/com/gemofgemma/ui/chat/ChatBubble.kt
          sed -i 's/private fun InferenceStatsChip/fun InferenceStatsChip/' ui/src/main/java/com/gemofgemma/ui/chat/ChatBubble.kt
      - name: Compile item 12
        run: ./gradlew --no-configuration-cache :ui:compileDebugKotlin --stacktrace
      - name: Commit item 12 and clean verification workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src/main/java/com/gemofgemma/ui/chat/ChatBubble.kt
          git rm .github/workflows/item-12-current-verify.yml .github/workflows/item-12-fix2.yml || true
          git commit -m "refactor: expose ChatBubble helper composables"
          git push origin HEAD
