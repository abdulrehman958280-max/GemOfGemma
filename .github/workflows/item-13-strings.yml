              if len(v.strip())<2:continue
              k=re.sub(r'[^A-Za-z0-9]+','_',v).strip('_').lower()[:80]
              if not k:continue
              if not re.search(rf'<string name="{re.escape(k)}">',resources):resources=resources.replace('</resources>',f'    <string name="{k}">{html.escape(v,quote=False)}</string>\n</resources>')
              text=text.replace(f'Text("{v}")',f'Text(stringResource(R.string.{k}))').replace(f'Text(text = "{v}")',f'Text(text = stringResource(R.string.{k}))').replace(f'contentDescription = "{v}"',f'contentDescription = stringResource(R.string.{k})').replace(f'label = "{v}"',f'label = stringResource(R.string.{k})')
          if 'stringResource(' in text and 'import androidx.compose.ui.res.stringResource' not in text:
              lines=text.splitlines();lines.insert(1,'import androidx.compose.ui.res.stringResource');text='\n'.join(lines)+'\n'
          path.write_text(text);xml.write_text(resources)
          PY
      - run: ./gradlew --no-configuration-cache :ui:compileDebugKotlin --stacktrace
      - name: Commit Onboarding strings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src/main/java/com/gemofgemma/ui/onboarding/OnboardingScreen.kt ui/src/main/res/values/strings.xml
          git commit -m "refactor: externalize OnboardingScreen strings"
          git push origin HEAD

