          text=path.read_text(); resources=xml.read_text()
          values=[]
          for pat in [r'Text\(\s*(?:text\s*=\s*)?"((?:\\.|[^"\\])*)"',r'contentDescription\s*=\s*"((?:\\.|[^"\\])*)"',r'(?<![A-Za-z0-9_])label\s*=\s*"((?:\\.|[^"\\])*)"']:
              values += re.findall(pat,text)
          for raw in values:
              if '$' in raw: continue
