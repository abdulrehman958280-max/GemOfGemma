name: Item 09 verification
on:
  push:
    paths:
      - accessibility/**
      - .github/workflows/item-09-verify.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: grep -n 'NOT YET WIRED' accessibility/src/main/java/com/gemofgemma/accessibility/OmniCodeAccessibilityService.kt
      - run: ./gradlew --no-configuration-cache :accessibility:compileDebugKotlin --stacktrace
      - name: Remove verification workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/item-09-verify.yml
          git commit -m "chore: remove item 9 verification workflow"
          git push origin HEAD
