name: Finalize polish build
on:
  push:
    paths:
      - .github/workflows/finalize2.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fix stale research filename references
        shell: bash
        run: |
          old='08-silent-autonomous-execution.md'
          new='08-android-automation-api-research.md'
          if git grep -l "$old" -- ':!*.lock' > /tmp/stale_refs; then
            while IFS= read -r file; do sed -i "s/$old/$new/g" "$file"; done < /tmp/stale_refs
          fi
          test -f Gemma4Research/08-android-automation-api-research.md
          grep -q 'Note: this is background research; nothing in this document is implemented as an app feature.' Gemma4Research/08-android-automation-api-research.md
          ! git grep -n "$old" -- ':!*.lock'
      - name: Final debug build
        run: ./gradlew --no-configuration-cache assembleDebug --stacktrace
      - name: Final static verification
        shell: bash
        run: |
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' -o -name '*.yaml' | wc -l)" -eq 1
          test -f .github/workflows/build-apk.yml
          echo 'Chat contentDescription null occurrences:'
          git grep -n 'contentDescription = null' -- ui/src/main/java/com/gemofgemma/ui/chat || true
          echo 'Legacy branding occurrences:'
          git grep -n -E 'GemOfGemma|Gem of Gemma' -- app ui || true
          echo 'Final verification complete'
      - name: Commit final changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalize2.yml
          git add -A
          git commit -m "chore: finalize 14 item polish" || true
          git push origin HEAD:fix/sequential-14-item-polish
