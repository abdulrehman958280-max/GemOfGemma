name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          found=0
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            cp "$apk" "dist/GemOfGemma-$(basename "$apk")"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "No release APK was produced" >&2
            exit 1
          fi
          echo "APK files:"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GemOfGemma-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GemOfGemma Build ${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: dist/*.apk

      - name: Publish download links
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/build-${{ github.run_number }}
        shell: bash
        run: |
          {
            echo "## APK Build Complete"
            echo
            echo "### Download APK"
            echo
            echo "Permanent release page: ${RELEASE_URL}"
            echo
            echo "Workflow run / artifact: ${RUN_URL}"
            echo
            echo "### Files"
            for apk in dist/*.apk; do
              echo "- \`$(basename "$apk")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
