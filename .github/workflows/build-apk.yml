name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: latest
  ARTIFACT_NAME: OmniCode-APK

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APKs only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          found=0
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            cp "$apk" "dist/OmniCode-$(basename "$apk")"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "No release APK was produced" >&2
            exit 1
          fi
          echo "Only APK files will be published:"
          ls -lh dist/*.apk

      - name: Remove previous Actions APK artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact_name in "$ARTIFACT_NAME" GemOfGemma-APK; do
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id" \
            | while read -r artifact_id; do
                [ -n "$artifact_id" ] || continue
                gh api --method DELETE \
                  -H 'Accept: application/vnd.github+json' \
                  "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              done
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Replace previous GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" dist/*.apk \
            --title "OmniCode Latest APK" \
            --notes "Latest OmniCode APK build from ${GITHUB_SHA}. Assets in this release are APK files only." \
            --latest

      - name: Publish download links
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          {
            echo "## OmniCode APK Build Complete"
            echo
            echo "### Download APK"
            echo
            echo "Latest release: ${RELEASE_URL}"
            echo
            echo "Workflow run / artifact: ${RUN_URL}"
            echo
            echo "### Published files"
            for apk in dist/*.apk; do
              echo "- \`$(basename "$apk")\`"
            done
            echo
            echo "Old release assets and old Actions APK artifacts are replaced on every run."
          } >> "$GITHUB_STEP_SUMMARY"
