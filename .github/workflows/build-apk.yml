name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: latest
  ARTIFACT_NAME: OmniCode-APK

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release signing secrets are not configured. Continuing with the Gradle debug-signing fallback so the APK build can complete."
            echo "For a production/reproducible release signature, configure all four ANDROID_KEYSTORE_* / ANDROID_KEY_* secrets."
            exit 0
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/omnicode-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Persistent OmniCode release signing key configured."

      - name: Build release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Collect APKs only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          found=0
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            cp "$apk" "dist/OmniCode-$(basename "$apk")"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "No release APK was produced" >&2
            exit 1
          fi
          echo "Only APK files will be published:"
          ls -lh dist/*.apk

      - name: Remove previous OmniCode APK artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == env.ARTIFACT_NAME) | .id' \
          | while read -r artifact_id; do
              [ -n "$artifact_id" ] || continue
              gh api --method DELETE \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Replace previous GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" dist/*.apk \
            --title "OmniCode Latest APK" \
            --notes "Latest OmniCode APK build from ${GITHUB_SHA}. Assets in this release are APK files only." \
            --latest

      - name: Publish download links
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          {
            echo "## OmniCode APK Build Complete"
            echo
            echo "### Download APK"
            echo
            echo "Latest release: ${RELEASE_URL}"
            echo
            echo "Workflow run / artifact: ${RUN_URL}"
            echo
            echo "### Published files"
            for apk in dist/*.apk; do
              echo "- \`$(basename "$apk")\`"
            done
            echo
            echo "Old release assets and old Actions APK artifacts are replaced on every run."
          } >> "$GITHUB_STEP_SUMMARY"
