name: Item 02 verification harness
on:
  push:
    paths:
      - .github/workflows/item-01-harness.yml
permissions:
  contents: write
jobs:
  item-02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Item 2
        shell: python
        run: |
          from pathlib import Path
          p = Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt')
          s = p.read_text()
          marker = '    val sheetState = rememberModalBottomSheetState(skipPartiallyExpanded = true)\n'
          if 'var pendingDelete by remember { mutableStateOf<com.gemofgemma.core.data.ConversationEntity?>(null) }' not in s:
              if marker not in s: raise SystemExit('Item 2: conversation sheet state marker not found')
              s = s.replace(marker, marker + '    var pendingDelete by remember { mutableStateOf<com.gemofgemma.core.data.ConversationEntity?>(null) }\n', 1)
          old_click = 'onClick = { onDelete(conv.id) },'
          new_click = 'onClick = { pendingDelete = conv },'
          if old_click in s:
              s = s.replace(old_click, new_click, 1)
          elif new_click not in s:
              raise SystemExit('Item 2: delete button callback not found')
          tail = '''                }\n            }\n        }\n    }\n}'''
          dialog_tail = '''                }\n            }\n            pendingDelete?.let { conversation ->\n                AlertDialog(\n                    onDismissRequest = { pendingDelete = null },\n                    title = { Text("Delete conversation?") },\n                    text = { Text("Delete this conversation? This can't be undone.") },\n                    confirmButton = {\n                        TextButton(\n                            onClick = {\n                                pendingDelete = null\n                                onDelete(conversation.id)\n                            }\n                        ) { Text("Delete") }\n                    },\n                    dismissButton = {\n                        TextButton(onClick = { pendingDelete = null }) { Text("Cancel") }\n                    }\n                )\n            }\n        }\n    }\n}'''
          if 'title = { Text("Delete conversation?") }' not in s:
              if tail not in s: raise SystemExit('Item 2: conversation sheet tail not found')
              s = s.replace(tail, dialog_tail, 1)
          p.write_text(s)
      - name: Re-read Item 2 change
        run: |
          grep -n "pendingDelete\|Delete conversation\|onDelete(conversation.id)" ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt
      - name: Compile ui
        run: ./gradlew --no-configuration-cache :ui:compileDebugKotlin --stacktrace
      - name: Commit Item 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt
          git commit -m "fix: confirm conversation deletion"
          git push origin HEAD
