name: Item 09 verification
on:
  push:
    paths:
      - .github/workflows/item-01-harness.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Item 9
        shell: python
        run: |
          from pathlib import Path
          for name in ['AccessibilityBridge.kt', 'OmniCodeAccessibilityService.kt']:
              p = Path('accessibility/src/main/java/com/gemofgemma/accessibility') / name
              s = p.read_text()
              note = '// NOT YET WIRED — reserved for future UI-automation tool, not called by ActionDispatcher.\n'
              if note not in s:
                  lines = s.splitlines(True)
                  package_end = next(i for i, line in enumerate(lines) if line.startswith('package ')) + 1
                  lines.insert(package_end, '\n' + note)
                  p.write_text(''.join(lines))
      - name: Re-read changed files
        run: |
          sed -n '1,12p' accessibility/src/main/java/com/gemofgemma/accessibility/AccessibilityBridge.kt
          sed -n '1,12p' accessibility/src/main/java/com/gemofgemma/accessibility/OmniCodeAccessibilityService.kt
      - name: Compile affected module
        run: ./gradlew --no-configuration-cache :accessibility:compileDebugKotlin --stacktrace
      - name: Commit Item 9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accessibility/src/main/java/com/gemofgemma/accessibility/AccessibilityBridge.kt accessibility/src/main/java/com/gemofgemma/accessibility/OmniCodeAccessibilityService.kt
          git commit -m "docs: mark accessibility bridge as not yet wired"
          git pull --rebase origin fix/sequential-14-item-polish
          git push origin HEAD:fix/sequential-14-item-polish
