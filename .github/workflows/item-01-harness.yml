name: Item 10 verification
on:
  push:
    paths:
      - .github/workflows/item-01-harness.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Item 10
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          old = 'android:allowBackup="true"'
          if old in s:
              s = s.replace(old, 'android:allowBackup="false"', 1)
          elif 'android:allowBackup="false"' not in s:
              raise SystemExit('Item 10: allowBackup attribute not found')
          p.write_text(s)
      - name: Re-read changed file
        run: grep -n "allowBackup" app/src/main/AndroidManifest.xml
      - name: Compile affected module
        run: ./gradlew --no-configuration-cache :app:compileDebugKotlin --stacktrace
      - name: Commit Item 10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml
          git commit -m "security: disable app backup for local chat data"
          git pull --rebase origin fix/sequential-14-item-polish
          git push origin HEAD:fix/sequential-14-item-polish
