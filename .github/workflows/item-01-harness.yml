name: Item 03 verification harness
on:
  push:
    paths:
      - .github/workflows/item-01-harness.yml
permissions:
  contents: write
jobs:
  item-03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Item 3
        shell: python
        run: |
          from pathlib import Path
          p = Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt')
          s = p.read_text()
          before = s
          count_36 = s.count('modifier = Modifier.size(36.dp)')
          if count_36 == 0: raise SystemExit('Item 3: no explicit 36dp IconButton modifiers found')
          s = s.replace('modifier = Modifier.size(36.dp)', 'modifier = Modifier.size(48.dp)')
          if '                        .size(44.dp)' not in s:
              raise SystemExit('Item 3: 44dp attachment button marker not found')
          s = s.replace('                        .size(44.dp)', '                        .size(48.dp)', 1)
          old_delete = 'modifier = Modifier.size(32.dp)'
          if old_delete not in s: raise SystemExit('Item 3: 32dp conversation delete button marker not found')
          s = s.replace(old_delete, 'modifier = Modifier.size(48.dp)', 1)
          if s == before: raise SystemExit('Item 3: no changes made')
          p.write_text(s)
      - name: Re-read Item 3 changes
        run: |
          grep -n "size(48.dp)" ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt
      - name: Compile ui
        run: ./gradlew --no-configuration-cache :ui:compileDebugKotlin --stacktrace
      - name: Commit Item 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt
          git commit -m "fix: meet chat icon touch target minimums"
          git push origin HEAD
