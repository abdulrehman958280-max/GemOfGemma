name: Item 07 verification
on:
  push:
    paths:
      - .github/workflows/item-01-harness.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Item 7
        shell: python
        run: |
          from pathlib import Path
          vm = Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatViewModel.kt')
          s = vm.read_text()
          imports = [
              ('import kotlinx.coroutines.flow.MutableSharedFlow\n', 'import kotlinx.coroutines.flow.MutableSharedFlow\n'),
              ('import kotlinx.coroutines.flow.SharedFlow\n', 'import kotlinx.coroutines.flow.SharedFlow\n'),
              ('import kotlinx.coroutines.flow.asSharedFlow\n', 'import kotlinx.coroutines.flow.asSharedFlow\n'),
              ('import kotlinx.coroutines.flow.collect\n', 'import kotlinx.coroutines.flow.collect\n')
          ]
          if 'import kotlinx.coroutines.flow.MutableSharedFlow\n' not in s: s = s.replace('import kotlinx.coroutines.flow.MutableStateFlow\n', imports[0][1] + 'import kotlinx.coroutines.flow.MutableStateFlow\n', 1)
          if 'import kotlinx.coroutines.flow.SharedFlow\n' not in s: s = s.replace('import kotlinx.coroutines.flow.StateFlow\n', imports[1][1] + 'import kotlinx.coroutines.flow.StateFlow\n', 1)
          if 'import kotlinx.coroutines.flow.asSharedFlow\n' not in s: s = s.replace('import kotlinx.coroutines.flow.asStateFlow\n', imports[2][1] + 'import kotlinx.coroutines.flow.asStateFlow\n', 1)
          if 'import kotlinx.coroutines.flow.collect\n' not in s: s = s.replace('import kotlinx.coroutines.flow.collect\n', 'import kotlinx.coroutines.flow.collect\n', 1) if 'import kotlinx.coroutines.flow.collect\n' in s else s.replace('import kotlinx.coroutines.flow.catch\n', 'import kotlinx.coroutines.flow.catch\nimport kotlinx.coroutines.flow.collect\n', 1)
          marker = '    val pendingConfirmation: StateFlow<ActionResult.NeedsConfirmation?> = _pendingConfirmation.asStateFlow()\n'
          if 'val snackbarEvent: SharedFlow<String>' not in s:
              if marker not in s: raise SystemExit('Item 7 VM state marker not found')
              s = s.replace(marker, marker + '\n    private val _snackbarEvent = MutableSharedFlow<String>(extraBufferCapacity = 1)\n    val snackbarEvent: SharedFlow<String> = _snackbarEvent.asSharedFlow()\n', 1)
          old = 'is com.gemofgemma.core.model.ActionResult.Error -> "Action failed: ${result.message}"\n                    is com.gemofgemma.core.model.ActionResult.PermissionRequired ->\n                        "Permissions needed: ${result.permissions.joinToString()}"'
          new = '''is com.gemofgemma.core.model.ActionResult.Error -> {\n                        _snackbarEvent.tryEmit("Action failed: ${result.message}")\n                        ""\n                    }\n                    is com.gemofgemma.core.model.ActionResult.PermissionRequired -> {\n                        _snackbarEvent.tryEmit("Permissions needed: ${result.permissions.joinToString()}")\n                        ""\n                    }'''
          if old not in s: raise SystemExit('Item 7 VM action-result marker not found')
          vm.write_text(s.replace(old, new, 1))

          screen = Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt')
          s = screen.read_text()
          if 'import androidx.compose.material3.SnackbarHostState\n' not in s:
              s = s.replace('import androidx.compose.material3.SnackbarHost\n', 'import androidx.compose.material3.SnackbarHost\nimport androidx.compose.material3.SnackbarHostState\n', 1) if 'import androidx.compose.material3.SnackbarHost\n' in s else s.replace('import androidx.compose.material3.Surface\n', 'import androidx.compose.material3.SnackbarHost\nimport androidx.compose.material3.SnackbarHostState\nimport androidx.compose.material3.Surface\n', 1)
          if 'import androidx.compose.material3.Scaffold\n' not in s:
              s = s.replace('import androidx.compose.material3.Surface\n', 'import androidx.compose.material3.Scaffold\nimport androidx.compose.material3.Surface\n', 1)
          marker = '    val pendingConfirmation by viewModel.pendingConfirmation.collectAsStateWithLifecycle()\n'
          if 'val snackbarHostState = remember { SnackbarHostState() }' not in s:
              if marker not in s: raise SystemExit('Item 7 Screen state marker not found')
              s = s.replace(marker, marker + '    val snackbarHostState = remember { SnackbarHostState() }\n', 1)
          marker = '    LaunchedEffect(uiState.isLoading) {'
          if 'viewModel.snackbarEvent.collect' not in s:
              if marker not in s: raise SystemExit('Item 7 Screen effect marker not found')
              s = s.replace(marker, '''    LaunchedEffect(Unit) {\n        viewModel.snackbarEvent.collect { message ->\n            snackbarHostState.showSnackbar(message)\n        }\n    }\n\n    LaunchedEffect(uiState.isLoading) {''', 1)
          old = '''    Column(\n        modifier = Modifier\n            .fillMaxSize()\n            .background(MaterialTheme.colorScheme.background)\n            .imePadding()\n    ) {'''
          new = '''    Scaffold(\n        snackbarHost = { SnackbarHost(snackbarHostState) }\n    ) { innerPadding ->\n        Column(\n            modifier = Modifier\n                .fillMaxSize()\n                .background(MaterialTheme.colorScheme.background)\n                .padding(innerPadding)\n                .imePadding()\n        ) {'''
          if 'snackbarHost = { SnackbarHost(snackbarHostState) }' not in s:
              if old not in s: raise SystemExit('Item 7 Screen root Column not found')
              s = s.replace(old, new, 1)
              anchor = '\n    // Tool picker bottom sheet'
              idx = s.find(anchor)
              if idx < 0: raise SystemExit('Item 7 Screen closing anchor not found')
              prefix, suffix = s[:idx], s[idx:]
              lines = prefix.rstrip().split('\n')
              if lines[-1].strip() != '}': raise SystemExit('Item 7 Screen root close not found')
              lines[-1] = '        }'
              s = '\n'.join(lines) + '\n    }\n' + suffix
          screen.write_text(s)
      - name: Re-read changed files
        run: |
          grep -n "NeedsConfirmation\|dispatchConfirmed" core/src/main/java/com/gemofgemma/core/model/AiResponse.kt actions/src/main/java/com/gemofgemma/actions/ActionDispatcher.kt
          grep -n "snackbarEvent\|SnackbarHostState\|SnackbarHost" ui/src/main/java/com/gemofgemma/ui/chat/ChatViewModel.kt ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt
      - name: Compile affected modules
        run: ./gradlew --no-configuration-cache :core:compileDebugKotlin :actions:compileDebugKotlin :ui:compileDebugKotlin --stacktrace
      - name: Commit Item 7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src/main/java/com/gemofgemma/ui/chat/ChatViewModel.kt ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt
          git commit -m "feat: route transient action errors to snackbar"
          git push origin HEAD
