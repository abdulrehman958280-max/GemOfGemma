name: Item 07 verification harness
on:
  push:
    paths:
      - .github/workflows/item-01-harness.yml
permissions:
  contents: write
jobs:
  item-07:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Item 7
        shell: python
        run: |
          from pathlib import Path

          vm = Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatViewModel.kt')
          s = vm.read_text()
          s = s.replace('import kotlinx.coroutines.flow.MutableStateFlow\n', 'import kotlinx.coroutines.flow.MutableSharedFlow\nimport kotlinx.coroutines.flow.MutableStateFlow\n', 1)
          s = s.replace('import kotlinx.coroutines.flow.StateFlow\n', 'import kotlinx.coroutines.flow.SharedFlow\nimport kotlinx.coroutines.flow.StateFlow\n', 1)
          s = s.replace('import kotlinx.coroutines.flow.asStateFlow\n', 'import kotlinx.coroutines.flow.asSharedFlow\nimport kotlinx.coroutines.flow.asStateFlow\n', 1)
          state_marker = '    val pendingConfirmation: StateFlow<ActionResult.NeedsConfirmation?> = _pendingConfirmation.asStateFlow()\n'
          if 'val snackbarEvent: SharedFlow<String>' not in s:
              if state_marker not in s: raise SystemExit('Item 7: pending confirmation state marker not found')
              s = s.replace(state_marker, state_marker + '''\n    private val _snackbarEvent = MutableSharedFlow<String>(extraBufferCapacity = 1)\n    val snackbarEvent: SharedFlow<String> = _snackbarEvent.asSharedFlow()\n''', 1)
          persist_old = '''    private fun persistAssistantMessage(message: ChatMessage) {\n        viewModelScope.launch(Dispatchers.IO) {\n            chatRepository.saveMessage(currentConversationId, message)\n        }\n    }'''
          persist_new = '''    private fun persistAssistantMessage(message: ChatMessage) {\n        if (message.messageType == ChatMessage.MessageType.ERROR && message.content.isBlank()) return\n        viewModelScope.launch(Dispatchers.IO) {\n            chatRepository.saveMessage(currentConversationId, message)\n        }\n    }'''
          if persist_old in s: s = s.replace(persist_old, persist_new, 1)
          error_branch = '''                    is com.gemofgemma.core.model.ActionResult.Error -> "Action failed: ${result.message}"\n                    is com.gemofgemma.core.model.ActionResult.PermissionRequired ->\n                        "Permissions needed: ${result.permissions.joinToString()}"'''
          error_replacement = '''                    is com.gemofgemma.core.model.ActionResult.Error -> {\n                        _snackbarEvent.tryEmit("Action failed: ${result.message}")\n                        return ChatMessage(\n                            id = UUID.randomUUID().toString(),\n                            role = ChatMessage.Role.ASSISTANT,\n                            content = "",\n                            messageType = ChatMessage.MessageType.ERROR\n                        )\n                    }\n                    is com.gemofgemma.core.model.ActionResult.PermissionRequired -> {\n                        _snackbarEvent.tryEmit("Permissions needed: ${result.permissions.joinToString()}")\n                        return ChatMessage(\n                            id = UUID.randomUUID().toString(),\n                            role = ChatMessage.Role.ASSISTANT,\n                            content = "",\n                            messageType = ChatMessage.MessageType.ERROR\n                        )\n                    }'''
          if error_branch not in s:
              if 'Action failed: ${result.message}' not in s: raise SystemExit('Item 7: action error branch not found')
          else:
              s = s.replace(error_branch, error_replacement, 1)
          vm.write_text(s)

          screen = Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt')
          s = screen.read_text()
          s = s.replace('import androidx.compose.material3.Surface\n', 'import androidx.compose.material3.SnackbarHost\nimport androidx.compose.material3.SnackbarHostState\nimport androidx.compose.material3.Surface\n', 1)
          state_marker = '    val haptics = LocalHapticFeedback.current\n'
          if 'val snackbarHostState = remember { SnackbarHostState() }' not in s:
              if state_marker not in s: raise SystemExit('Item 7: ChatScreen haptic state marker not found')
              s = s.replace(state_marker, state_marker + '    val snackbarHostState = remember { SnackbarHostState() }\n', 1)
          effect_marker = '    LaunchedEffect(uiState.isLoading) {\n'
          snackbar_effect = '''    LaunchedEffect(Unit) {\n        viewModel.snackbarEvent.collect { message ->\n            snackbarHostState.showSnackbar(message)\n        }\n    }\n\n'''
          if 'viewModel.snackbarEvent.collect' not in s:
              if effect_marker not in s: raise SystemExit('Item 7: LaunchedEffect insertion marker not found')
              s = s.replace(effect_marker, snackbar_effect + effect_marker, 1)
          column_start = '''    Column(\n        modifier = Modifier\n            .fillMaxSize()\n            .background(MaterialTheme.colorScheme.background)\n            .imePadding()\n    ) {'''
          scaffold_start = '''    Scaffold(\n        snackbarHost = { SnackbarHost(snackbarHostState) }\n    ) { innerPadding ->\n        Column(\n            modifier = Modifier\n                .fillMaxSize()\n                .background(MaterialTheme.colorScheme.background)\n                .padding(innerPadding)\n                .imePadding()\n        ) {'''
          if 'snackbarHost = { SnackbarHost(snackbarHostState) }' not in s:
              if column_start not in s: raise SystemExit('Item 7: root ChatScreen Column marker not found')
              s = s.replace(column_start, scaffold_start, 1)
              tail = '''        }\n    }\n\n    // Tool picker bottom sheet'''
              replacement = '''        }\n        }\n    }\n\n    // Tool picker bottom sheet'''
              if tail not in s: raise SystemExit('Item 7: root ChatScreen Column closing marker not found')
              s = s.replace(tail, replacement, 1)
          message_block = '''                            ) {\n                                ChatBubble(message = message, showInferenceStats = uiState.showInferenceStats)\n                            }'''
          filtered_block = '''                            ) {\n                                if (!(message.messageType == ChatMessage.MessageType.ERROR && message.content.isBlank())) {\n                                    ChatBubble(message = message, showInferenceStats = uiState.showInferenceStats)\n                                }\n                            }'''
          if message_block in s:
              s = s.replace(message_block, filtered_block, 1)
          screen.write_text(s)
      - name: Re-read Item 7 changes
        run: |
          grep -n "snackbarEvent\|SnackbarHost\|SnackbarHostState" ui/src/main/java/com/gemofgemma/ui/chat/ChatViewModel.kt ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt
      - name: Compile ui
        run: ./gradlew --no-configuration-cache :ui:compileDebugKotlin --stacktrace
      - name: Commit Item 7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src/main/java/com/gemofgemma/ui/chat/ChatViewModel.kt ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt
          git commit -m "feat: route transient action errors to snackbar"
          git push origin HEAD
