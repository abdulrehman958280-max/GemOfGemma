name: Item 05 verification harness
on:
  push:
    paths:
      - .github/workflows/item-01-harness.yml
permissions:
  contents: write
jobs:
  item-05:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Item 5
        shell: python
        run: |
          from pathlib import Path
          p = Path('ui/src/main/java/com/gemofgemma/ui/components/GlassmorphismCard.kt')
          s = p.read_text()
          marker = '            .border(\n                width = 1.dp,\n                color = borderColor,\n                shape = MaterialTheme.shapes.large\n            )\n'
          replacement = marker + '            .blur(blur)\n'
          if '.blur(blur)' not in s:
              if marker not in s: raise SystemExit('Item 5: glass card border marker not found')
              s = s.replace(marker, replacement, 1)
          p.write_text(s)
      - name: Re-read Item 5 change
        run: |
          grep -n "blur(blur)" ui/src/main/java/com/gemofgemma/ui/components/GlassmorphismCard.kt
      - name: Compile ui
        run: ./gradlew --no-configuration-cache :ui:compileDebugKotlin --stacktrace
      - name: Commit Item 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src/main/java/com/gemofgemma/ui/components/GlassmorphismCard.kt
          git commit -m "fix: apply glass card blur parameter"
          git push origin HEAD
