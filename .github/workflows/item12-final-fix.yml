name: Item 12 final compile fix
on:
  push:
    paths:
      - .github/workflows/item12-final-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fix ChatBubble animation dependency
        shell: python
        run: |
          from pathlib import Path
          p=Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatBubble.kt')
          t=p.read_text()
          t=t.replace('import androidx.compose.animation.core.Spring\n','').replace('import androidx.compose.animation.core.spring\n','')
          t=t.replace('''                .animateContentSize(\n                    animationSpec = spring(\n                        dampingRatio = Spring.DampingRatioLowBouncy,\n                        stiffness = Spring.StiffnessMediumLow\n                    )\n                )''','''                .animateContentSize()''')
          t=t.replace('''                .animateContentSize(\n                    animationSpec = spring(\n                        dampingRatio = Spring.DampingRatioLowBouncy,\n                        stiffness = Spring.StiffnessMediumLow\n                    )\n                )''','''                .animateContentSize()''')
          p.write_text(t)
          Path('item12-compile.log').unlink(missing_ok=True)
      - name: Compile affected UI module
        run: ./gradlew --no-configuration-cache :ui:compileDebugKotlin --stacktrace
      - name: Final debug build
        run: ./gradlew --no-configuration-cache assembleDebug --stacktrace
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/item12-final-fix.yml
          git add -A
          git commit -m "fix: stabilize extracted chat bubble" 
          git push origin HEAD:fix/sequential-14-item-polish
