name: Item 13 finalize chat strings
on:
  push:
    paths:
      - .github/workflows/item13-finalize.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Migrate Chat UI strings
        shell: python
        run: |
          from pathlib import Path
          import re, html, json
          root = Path('ui/src/main')
          files = sorted((root / 'java/com/gemofgemma/ui/chat').glob('*.kt'))
          resource_file = root / 'res/values/strings.xml'
          mapping = {}
          if resource_file.exists():
              for name, value in re.findall(r'<string name="([^"]+)">(.*?)</string>', resource_file.read_text(), re.S):
                  mapping[name] = html.unescape(value)
          def slug(value):
              return 'chat_' + (re.sub(r'[^a-z0-9]+', '_', value.lower()).strip('_')[:45] or 'text')
          targets = ('text =','Text(','contentDescription =','label =','title =','description =','message =','placeholder =','supportingText =')
          string_re = re.compile(r'"(?:\\.|[^"\\])*"')
          count = 0
          for path in files:
              lines = path.read_text().splitlines(keepends=True)
              out = []
              changed = False
              for line in lines:
                  if not any(t in line for t in targets):
                      out.append(line); continue
                  def repl(m):
                      nonlocal count
                      raw = m.group(0)
                      try: value = json.loads(raw)
                      except Exception: return raw
                      if not value or '${' in value or value.startswith('android.permission.') or '://' in value or '/' in value:
                          return raw
                      name = slug(value); base = name; i = 2
                      while name in mapping and mapping[name] != value:
                          name = f'{base}_{i}'; i += 1
                      mapping[name] = value; count += 1
                      return f'stringResource(R.string.{name})'
                  new_line = string_re.sub(repl, line)
                  changed |= new_line != line
                  out.append(new_line)
              if changed:
                  text = ''.join(out)
                  if 'stringResource(' in text and 'import androidx.compose.ui.res.stringResource' not in text:
                      first_import = text.find('import ')
                      text = text[:first_import] + 'import androidx.compose.ui.res.stringResource\n' + text[first_import:]
                  if 'R.string.' in text and 'import com.gemofgemma.ui.R' not in text:
                      first_import = text.find('import ')
                      text = text[:first_import] + 'import com.gemofgemma.ui.R\n' + text[first_import:]
                  if path.name == 'ChatBubble.kt':
                      text = text.replace('var showCopyButton by remember { mutableStateOf(false) }', 'var showCopyButton by remember { mutableStateOf(false) }\n    val copiedLabel = stringResource(R.string.chat_copied)\n    val copyResponseLabel = stringResource(R.string.chat_copy_response)')
                      text = text.replace('contentDescription = if (copied) stringResource(R.string.chat_copied) else stringResource(R.string.chat_copy_response)', 'contentDescription = if (copied) copiedLabel else copyResponseLabel')
                  path.write_text(text)
          if count == 0:
              raise SystemExit('No Chat UI literals migrated')
          resource_file.parent.mkdir(parents=True, exist_ok=True)
          xml = ['<?xml version="1.0" encoding="utf-8"?>','<resources>']
          for name, value in sorted(mapping.items()):
              xml.append(f'    <string name="{name}">{html.escape(value, quote=False)}</string>')
          xml.append('</resources>')
          resource_file.write_text('\n'.join(xml) + '\n')
          print(f'Migrated {count} literals')
      - name: Compile affected UI module
        run: ./gradlew --no-configuration-cache :ui:compileDebugKotlin --stacktrace
      - name: Commit verified Item 13
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add ui/src/main/java/com/gemofgemma/ui/chat ui/src/main/res/values/strings.xml
          git commit -m "refactor: externalize chat strings"
          git push origin HEAD:fix/sequential-14-item-polish
