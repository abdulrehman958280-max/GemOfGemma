name: Item 13 ChatScreen fix
on:
  push:
    paths:
      - .github/workflows/item-13-chat-fix.yml
permissions:
  contents: write
jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fix R import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt'); t=p.read_text()
          if 'import com.gemofgemma.ui.R' not in t:
              lines=t.splitlines(); lines.insert(1,'import com.gemofgemma.ui.R'); t='\n'.join(lines)+'\n'
          p.write_text(t)
          PY
      - run: ./gradlew --no-configuration-cache :ui:compileDebugKotlin --stacktrace
      - name: Commit ChatScreen strings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src/main/java/com/gemofgemma/ui/chat/ChatScreen.kt ui/src/main/res/values/strings.xml
          git commit -m "refactor: externalize ChatScreen strings"
          git push origin HEAD
